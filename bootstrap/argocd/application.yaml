apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cobaltcore
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://host.minikube.internal:19418/cobaltcore-deployment/.git
    targetRevision: main
    path: bootstrap/argocd/stack
  destination:
    server: https://kubernetes.default.svc
    namespace: flux-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
