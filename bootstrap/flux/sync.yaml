apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cobaltcore-deployment
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: cobaltcore-deployment
  path: ./clusters/minikube
  prune: true
  wait: false
