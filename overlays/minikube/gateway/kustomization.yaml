apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- controller.yaml
- proxy.yaml
- gateway.yaml
- keystone-tls.yaml
- horizon-tls.yaml
patches:
- target:
    kind: HelmRelease
  patch: "apiVersion: helm.toolkit.fluxcd.io/v2\nkind: HelmRelease\nmetadata:\n  name:\
    \ patch-target\nspec:\n  driftDetection:\n    mode: enabled\n  interval: 5m\n"
- path: versions.yaml
