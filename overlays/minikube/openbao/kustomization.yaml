apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../bases/openbao
patches:
- target:
    kind: HelmRelease
    name: openbao
  patch: "apiVersion: helm.toolkit.fluxcd.io/v2\nkind: HelmRelease\nmetadata:\n  name:\
    \ patch-target\nspec:\n  values:\n    server:\n      ha:\n        enabled: false\n\
    \        replicas: 1\n      standalone:\n        enabled: true\n        config:\
    \ \"# kind-only \\u2014 production keeps ui = false\\nui = true\\n\\nlistener\\\
    \n          \\ \\\"tcp\\\" {\\n  tls_disable     = 0\\n  address         = \\\"\
    [::]:8200\\\"\\n\\\n          \\  cluster_address = \\\"[::]:8201\\\"\\n  tls_cert_file\
    \   = \\\"/openbao/tls/tls.crt\\\"\\\n          \\n  tls_key_file    = \\\"/openbao/tls/tls.key\\\
    \"\\n  # kind matches production\\\n          \\ mTLS posture\\n  tls_client_ca_file\
    \               = \\\"/openbao/tls/ca.crt\\\"\\\n          \\n  tls_require_and_verify_client_cert\
    \ = true\\n}\\n\\nstorage \\\"raft\\\" {\\n\\\n          \\  path = \\\"/openbao/data\\\
    \"\\n}\\n\\nservice_registration \\\"kubernetes\\\" {}\\n\"\n      dataStorage:\n\
    \        storageClass: standard\n        size: 2Gi\n      resources:\n       \
    \ requests:\n          cpu: 100m\n  install:\n    disableWait: true\n  upgrade:\n\
    \    disableWait: true\n"
- target:
    kind: HelmRelease
  patch: "apiVersion: helm.toolkit.fluxcd.io/v2\nkind: HelmRelease\nmetadata:\n  name:\
    \ patch-target\nspec:\n  driftDetection:\n    mode: enabled\n  interval: 5m\n"
- path: versions.yaml
