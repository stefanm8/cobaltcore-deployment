apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- https://github.com/stefanm8/cobaltcore//deploy/gitops/bases/controlplane-operator?ref=7040f33b003cce68ef9e738ea485b765532967c3
patches:
- target:
    kind: HelmRelease
    name: c5c3-operator
  patch: "apiVersion: helm.toolkit.fluxcd.io/v2\nkind: HelmRelease\nmetadata:\n  name:\
    \ patch-target\nspec:\n  values:\n    replicas: 1\n  install:\n    remediation:\n\
    \      retries: 3\n"
- target:
    kind: HelmRelease
  patch: "apiVersion: helm.toolkit.fluxcd.io/v2\nkind: HelmRelease\nmetadata:\n  name:\
    \ patch-target\nspec:\n  driftDetection:\n    mode: enabled\n  interval: 5m\n"
- path: versions.yaml
