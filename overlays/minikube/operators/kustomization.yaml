apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../bases/operators
patches:
- target:
    kind: HelmRelease
    name: (keystone|horizon|glance|placement|barbican|ovn|neutron|cinder|nova)-operator
  patch: "apiVersion: helm.toolkit.fluxcd.io/v2\nkind: HelmRelease\nmetadata:\n  name:\
    \ patch-target\nspec:\n  values:\n    replicas: 1\n"
- target:
    kind: HelmRelease
    name: memcached-operator
  patch: "apiVersion: helm.toolkit.fluxcd.io/v2\nkind: HelmRelease\nmetadata:\n  name:\
    \ patch-target\nspec:\n  values:\n    webhook:\n      enabled: false\n"
- target:
    kind: GitRepository
  patch: "apiVersion: source.toolkit.fluxcd.io/v1\nkind: GitRepository\nmetadata:\n\
    \  name: patch-target\nspec:\n  timeout: 5m\n  ref:\n    branch: main\n"
- target:
    kind: HelmRelease
  patch: "apiVersion: helm.toolkit.fluxcd.io/v2\nkind: HelmRelease\nmetadata:\n  name:\
    \ patch-target\nspec:\n  driftDetection:\n    mode: enabled\n  interval: 5m\n"
- path: versions.yaml
